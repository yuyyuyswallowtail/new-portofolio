services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-portofolio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-portofolio}
      POSTGRES_DB: ${DATABASE_NAME:-portofolio}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-portofolio}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DATABASE_USERNAME:-portofolio}:${DATABASE_PASSWORD:-portofolio}@db:5432/${DATABASE_NAME:-portofolio}
      DIRECT_URL: postgres://${DATABASE_USERNAME:-portofolio}:${DATABASE_PASSWORD:-portofolio}@db:5432/${DATABASE_NAME:-portofolio}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: alpine:3.20
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./cron/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      app:
        condition: service_started

volumes:
  db_data:
  uploads_data:
